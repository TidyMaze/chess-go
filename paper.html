<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Whitepaper</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { background: #1a1a1a; color: #e5e5e5; font-family: Georgia, "Times New Roman", serif;
         line-height: 1.65; max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 6rem; }
  h1 { font-size: 2rem; line-height: 1.25; border-bottom: 2px solid #444; padding-bottom: 0.6rem; }
  h2 { font-size: 1.4rem; margin-top: 2.4rem; border-bottom: 1px solid #333; padding-bottom: 0.3rem; }
  h3 { font-size: 1.12rem; margin-top: 1.8rem; color: #cfcfcf; }
  table { border-collapse: collapse; width: 100%; margin: 1.2rem 0; font-size: 0.92em;
          font-family: -apple-system, sans-serif; }
  th, td { border: 1px solid #3a3a3a; padding: 0.45rem 0.7rem; text-align: left; }
  th { background: #262626; }
  tr:nth-child(even) td { background: #202020; }
  code { background: #262626; padding: 0.1rem 0.35rem; border-radius: 3px;
         font-family: ui-monospace, Menlo, monospace; font-size: 0.88em; }
  blockquote { border-left: 3px solid #b45309; margin-left: 0; padding-left: 1rem; color: #d6c9b4; }
  hr { border: none; border-top: 1px solid #333; margin: 2.5rem 0; }
  strong { color: #fff; }
  a { color: #60a5fa; }
  #meta { color: #999; font-size: 0.9em; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="content">Loading...</div>
<script>
fetch("WHITEPAPER.md?_=" + Date.now())
  .then(r => r.text())
  .then(t => { document.getElementById("content").innerHTML = marked.parse(t); })
  .catch(e => { document.getElementById("content").textContent = "Could not load WHITEPAPER.md: " + e; });
</script>
</body>
</html>
